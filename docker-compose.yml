# Grupo RYSA ERP - Docker Compose
# Punto de entrada: rysa_nginx (HTTP en ${NGINX_HTTP_PORT:-8080} del contenedor).
# El reverse proxy público (HTTPS, certificados, redirección) corre en el
# HOST del VPS como nginx nativo o equivalente — ver scripts/setup_nginx_host.sh
# y DEPLOY_VPS.md sección 5.

# Nombre de proyecto fijo: el stack es el mismo sin importar desde qué
# carpeta se ejecute `docker compose` (/opt/rysa/repo, /opt/rysa/Rysa, ...).
name: rysa

services:
  postgres:
    image: postgres:17
    container_name: rysa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rysa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rysa_dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-rysa}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - rysa_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rysa} -d ${POSTGRES_DB:-rysa}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # La primera inicialización del volumen (initdb + init scripts) tarda más.
      start_period: 60s
    # Sin puertos publicados: solo accesible dentro de la red interna.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rysa_backend
    restart: unless-stopped
    # .env.docker es la ÚNICA fuente de configuración del backend
    # (ENVIRONMENT, DATABASE_URL, JWT_SECRET, ADMIN_*, DEVELOPER_MODE...).
    # No se re-declaran aquí con `${VAR:-default}`: esa interpolación solo lee
    # el shell, y un `docker compose up` manual sin exportar variables
    # arrancaba el backend en development con la contraseña por defecto.
    env_file:
      - ./.env.docker
    environment:
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
      # Migración Legacy: código de las fases + datos DBF desplegables por
      # ZIP (Herramientas > Legacy > Datos) + reportes persistentes.
      - ./tools:/app/tools:ro
      - ./legacy_data:/app/legacy_data
      - ./legacy_reports:/app/legacy_reports
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rysa_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3);sys.exit(0 if r.status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: [
      "sh", "-c",
      "alembic upgrade head && python -m scripts.bootstrap_admin && uvicorn server:app --host 0.0.0.0 --port 8000"
    ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Ruta relativa: el SPA consume el mismo origen (proxy del host -> rysa_nginx -> backend).
        REACT_APP_BACKEND_URL: ""
    container_name: rysa_frontend
    restart: unless-stopped
    networks:
      - rysa_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: rysa_nginx
    restart: unless-stopped
    ports:
      # Solo loopback: el nginx del host (TLS) hace proxy_pass a 127.0.0.1.
      # Docker publica puertos por encima de UFW, así que publicar en 0.0.0.0
      # dejaría la app accesible por HTTP plano desde internet.
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - rysa_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  rysa_net:
    driver: bridge
    name: rysa_net

volumes:
  pgdata:
    name: rysa_pgdata
  uploads:
    name: rysa_uploads
