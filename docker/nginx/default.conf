# Nginx RYSA - Punto de entrada único del sistema
# Internet -> Nginx
#   /     -> frontend (SPA React)
#   /api/ -> backend FastAPI
#   /uploads/ -> archivos subidos servidos por el backend (opcional)

server {
    listen 80;
    server_name _;

    # Cabeceras básicas de seguridad (HSTS se agrega al activar TLS).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP razonablemente estricta pero compatible con el SPA y la API:
    #   - 'self' como origen por defecto
    #   - 'unsafe-inline'/'unsafe-eval' para CRA/CRACO
    #   - data:/blob:/https: para imágenes (incluye Unsplash y fondos de login)
    #   - ws/wss para WebSockets
    #   - fonts.googleapis.com + fonts.gstatic.com para tipografías
    #   - style-src-elem para hojas de estilo externas (Google Fonts CSS)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'self'; base-uri 'self';" always;

    # Docker DNS resolver + refresh cada 10s
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 350m;
    client_body_timeout 120s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # --- Frontend React ---
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
    }

    # --- Backend FastAPI ---
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Archivos subidos servidos por el backend ---
    location /uploads/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
