# Nginx RYSA - Reverse proxy INTERNO del stack Docker
# Este nginx NO se publica a internet: lo hace el nginx nativo del host
# (configurado con scripts/setup_nginx_host.sh). Aquí solo se hace
# routing interno + cabeceras de seguridad (CSP, HSTS via upstream header,
# X-Frame-Options, etc.) y soporte para el ZIP grande de Legacy
# (client_max_body_size 350m).

server {
    listen 80;
    server_name _;

    # Cabeceras básicas de seguridad (HSTS las inyecta el nginx del host).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'self'; base-uri 'self';" always;

    # ZIP legacy: hasta 350m (cambiar aquí y en LEGACY_ZIP_MAX_MB si es mayor).
    client_max_body_size 350m;
    client_body_timeout 300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # --- Frontend React ---
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
    }

    # --- Healthcheck directo del Backend ---
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
    }

    # --- Backend FastAPI ---
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Archivos subidos servidos por el backend ---
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
