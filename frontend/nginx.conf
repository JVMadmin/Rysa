# Frontend RYSA - Nginx sirve el SPA estático
# try_files -> index.html: React Router funciona al recargar rutas directas.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras básicas de seguridad.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Archivos estáticos con caché agresiva (hasheados por CRA/craco)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: cualquier ruta de cliente se sirve desde index.html.
    # index.html NUNCA se cachea: así cada visita revalida y toma el bundle
    # nuevo (los /static/ tienen hash inmmutable, así el cambio es transparente).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }
}
