name: ci

on:
  pull_request:
    branches: [evolucion-comercial, main]
  # Toda rama empujada publica sus imágenes: así se prueban en la PC local
  # (scripts/usar_imagenes_ci.sh) antes de pasarlas a evolucion-comercial.
  push:
    branches: ["**"]
    tags: ["v*"]

# Una corrida por rama/etiqueta: si llega otro push, se cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rysa
          POSTGRES_PASSWORD: test_pw
          POSTGRES_DB: rysa_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rysa -d rysa_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rysa:test_pw@localhost:5432/rysa_dev
      JWT_SECRET: ci_test_secret_must_be_at_least_32_characters_long_xx
      ADMIN_EMAIL: ci@rysa-dev.local
      ADMIN_PASSWORD: ciTestPassword123!
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install + lint
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          python -m py_compile server.py deps.py legacyadmin.py
          python -m py_compile scripts/check_installation.py scripts/bootstrap_admin.py
      - name: Migrate
        working-directory: backend
        run: alembic upgrade head
      - name: Unit tests
        working-directory: backend
        run: |
          pytest tests/test_bootstrap_admin.py tests/test_codigo_autorizacion.py \
            tests/test_pos_atomico.py tests/test_postgresql.py tests/test_p1_seguridad.py \
            -v --tb=short -n 0
      - name: Security gate
        working-directory: backend
        run: |
          pip install -q bandit
          bandit -r server.py deps.py legacyadmin.py -f json -o /tmp/bandit.json || true
          # Falla si hay P0/P1
          python -c "
          import json
          r = json.load(open('/tmp/bandit.json'))
          sev = {i['issue_severity']: i['issue_confidence'] for i in r.get('results',[])}
          bad = [i for i in r.get('results',[]) if i['issue_severity'] in ('HIGH','MEDIUM') and i['issue_confidence'] in ('HIGH',)]
          if bad:
              print('SECURITY GATE FAIL')
              for b in bad[:10]: print(f\"  {b['test_id']} {b['filename']}:{b['line_number']} {b['issue_text']}\")
              raise SystemExit(1)
          print('SECURITY GATE PASS')
          "

  # Imágenes listas para producción en GHCR. El VPS (scripts/deploy.sh) y la PC
  # local solo las descargan: nadie compila React ni instala dependencias.
  # Etiquetas: <commit completo> siempre, <rama> y <versión> (tags v*).
  build-images:
    needs: tests-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - servicio: backend
            contexto: backend
          - servicio: frontend
            contexto: frontend
          - servicio: nginx
            contexto: docker/nginx
    steps:
      - uses: actions/checkout@v4
      - name: Versión y etiquetas
        id: v
        run: |
          IMG=ghcr.io/jvmadmin/rysa-${{ matrix.servicio }}
          TAGS="$IMG:${GITHUB_SHA}"
          case "$GITHUB_REF" in
            refs/tags/v*) TAGS="$TAGS,$IMG:${GITHUB_REF_NAME#v}" ;;
            refs/heads/*) TAGS="$TAGS,$IMG:$(echo "$GITHUB_REF_NAME" | tr '/' '-')" ;;
          esac
          {
            echo "tags=$TAGS"
            echo "version=$(tr -d '[:space:]' < VERSION)"
            echo "commit=${GITHUB_SHA::7}"
            echo "fecha=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compilar ${{ matrix.servicio }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.v.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/JVMadmin/Rysa
          # Los mismos argumentos que pasa docker-compose.yml (cada Dockerfile
          # toma solo los suyos).
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
            GIT_COMMIT=${{ steps.v.outputs.commit }}
            BUILD_DATE=${{ steps.v.outputs.fecha }}
            REACT_APP_BACKEND_URL=
            REACT_APP_VERSION=${{ steps.v.outputs.version }}
            REACT_APP_COMMIT=${{ steps.v.outputs.commit }}
            REACT_APP_BUILD_DATE=${{ steps.v.outputs.fecha }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}
