name: deploy-vps

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [evolucion-comercial, main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/rysa_vps
          chmod 600 ~/.ssh/rysa_vps
          ssh -i ~/.ssh/rysa_vps -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" <<'REMOTE'
            set -euo pipefail
            cd /opt/rysa/repo
            git pull --ff-only
            ./scripts/deploy.sh
          REMOTE

      - name: Post-deploy healthcheck
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/rysa_vps -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" "/opt/rysa/repo/scripts/healthcheck.sh"
