# Nginx del Consultor de Precios (solo lectura).
#   /                -> SPA React (con fallback del router)
#   /static/         -> assets hasheados, cache inmutable
#   /api/            -> proxy al API aislado del consultor (solo /api/public-price)
# El frontend JAMAS accede a PostgreSQL ni a endpoints administrativos del ERP:
# solo conversa con este proxy.

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;

    root /usr/share/nginx/html;
    index index.html;

    # API del Consultor de Precios (solo lectura).
    location /api/ {
        proxy_pass http://rysa_price_checker:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Archivos cacheables (hasheados por CRA).
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: recargas y rutas directas se sirven desde index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }
}